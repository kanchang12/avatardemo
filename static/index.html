<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Avatar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080a0f;
    --surface: #0e1117;
    --border: #1e2533;
    --accent: #00e5ff;
    --accent2: #7c4dff;
    --text: #e8eaf0;
    --muted: #4a5568;
    --danger: #ff4d6d;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,229,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(124,77,255,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 2rem 1.5rem;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .header p {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.3rem;
    letter-spacing: 0.1em;
  }

  /* Avatar video container */
  .avatar-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 9/12;
    border-radius: 1.5rem;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: 1.5rem;
  }

  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(to bottom, transparent 60%, rgba(8,10,15,0.8) 100%);
    z-index: 2;
    pointer-events: none;
  }

  #avatarVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #idleVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: absolute;
    top: 0; left: 0;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(8,10,15,0.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 2rem;
    padding: 0.4rem 1rem;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .status-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.speaking { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: center;
  }

  .btn-mic {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
    outline: none;
  }

  .btn-mic:hover { background: rgba(0,229,255,0.08); }

  .btn-mic.recording {
    border-color: var(--danger);
    color: var(--danger);
    animation: ring 1.5s infinite;
  }

  .btn-mic.connected {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  @keyframes ring {
    0% { box-shadow: 0 0 0 0 rgba(255,77,109,0.4); }
    70% { box-shadow: 0 0 0 12px rgba(255,77,109,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,77,109,0); }
  }

  .btn-mic svg { width: 28px; height: 28px; }

  .btn-end {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    outline: none;
  }

  .btn-end:hover { border-color: var(--danger); color: var(--danger); }
  .btn-end svg { width: 20px; height: 20px; }

  /* Transcript */
  .transcript {
    margin-top: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1rem;
    min-height: 60px;
    max-height: 120px;
    overflow-y: auto;
    font-size: 0.75rem;
    line-height: 1.6;
    color: var(--muted);
  }

  .transcript .agent { color: var(--accent); }
  .transcript .user { color: var(--text); }

  /* Waveform */
  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 24px;
    margin-top: 1rem;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .waveform.active { opacity: 1; }

  .waveform span {
    display: block;
    width: 3px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 1s ease-in-out infinite;
  }

  .waveform span:nth-child(1) { animation-delay: 0s; }
  .waveform span:nth-child(2) { animation-delay: 0.1s; }
  .waveform span:nth-child(3) { animation-delay: 0.2s; }
  .waveform span:nth-child(4) { animation-delay: 0.3s; }
  .waveform span:nth-child(5) { animation-delay: 0.4s; }
  .waveform span:nth-child(6) { animation-delay: 0.3s; }
  .waveform span:nth-child(7) { animation-delay: 0.2s; }
  .waveform span:nth-child(8) { animation-delay: 0.1s; }

  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>AI Avatar</h1>
    <p>CONVERSATIONAL INTELLIGENCE</p>
  </div>

  <div class="avatar-wrap">
    <!-- Idle looping video -->
    <video id="idleVideo" src="/static/avatar.mp4" autoplay loop muted playsinline></video>
    <!-- Lip-sync video (hidden until speaking) -->
    <video id="avatarVideo" src="" playsinline style="display:none; position:absolute; top:0; left:0;"></video>

    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">READY</span>
    </div>
  </div>

  <div class="waveform" id="waveform">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="controls" style="margin-top:1.5rem;">
    <button class="btn-end" id="btnEnd" title="End call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <button class="btn-mic" id="btnMic" title="Start conversation">
      <svg id="iconMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <div style="width:48px;height:48px;"></div>
  </div>

  <div class="transcript" id="transcript">
    <div style="color:var(--muted);font-size:0.65rem;">Press mic to start conversation...</div>
  </div>
</div>

<script>
  // =================== CONFIG ===================
  const AGENT_ID = "YOUR_AGENT_ID"; // or leave blank, backend provides signed URL
  // ==============================================

  const btnMic = document.getElementById('btnMic');
  const btnEnd = document.getElementById('btnEnd');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const transcript = document.getElementById('transcript');
  const waveform = document.getElementById('waveform');
  const idleVideo = document.getElementById('idleVideo');
  const avatarVideo = document.getElementById('avatarVideo');

  let ws = null;
  let audioContext = null;
  let mediaStream = null;
  let processor = null;
  let connected = false;
  let audioQueue = [];
  let isPlayingLipSync = false;

  function setStatus(state, text) {
    statusDot.className = 'status-dot ' + state;
    statusText.textContent = text;
  }

  function addTranscript(role, text) {
    const div = document.createElement('div');
    div.className = role;
    div.textContent = (role === 'agent' ? '🤖 ' : '👤 ') + text;
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  async function startConversation() {
    try {
      setStatus('active', 'CONNECTING...');

      // Get signed URL from backend
      const res = await fetch('/get_signed_url');
      const { signed_url } = await res.json();

      ws = new WebSocket(signed_url);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        connected = true;
        btnMic.classList.add('connected');
        setStatus('active', 'CONNECTED');
        startMic();
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'audio') {
          // ElevenLabs sends base64 audio chunks
          const audioB64 = data.audio_event?.audio_base_64;
          if (audioB64) {
            playAgentAudio(audioB64);
            triggerLipSync(audioB64);
          }
        }

        if (data.type === 'agent_response') {
          addTranscript('agent', data.agent_response_event?.agent_response || '');
          setStatus('speaking', 'SPEAKING');
          waveform.classList.add('active');
        }

        if (data.type === 'user_transcript') {
          addTranscript('user', data.user_transcription_event?.user_transcript || '');
          setStatus('active', 'LISTENING');
          waveform.classList.remove('active');
        }

        if (data.type === 'interruption') {
          stopLipSync();
        }
      };

      ws.onclose = () => {
        connected = false;
        setStatus('', 'DISCONNECTED');
        waveform.classList.remove('active');
        btnMic.classList.remove('connected', 'recording');
        stopMic();
      };

      ws.onerror = () => setStatus('error', 'ERROR');

    } catch (err) {
      console.error(err);
      setStatus('error', 'FAILED');
    }
  }

  async function startMic() {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new AudioContext({ sampleRate: 16000 });
    const source = audioContext.createMediaStreamSource(mediaStream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);

    source.connect(processor);
    processor.connect(audioContext.destination);

    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        pcm16[i] = Math.max(-32768, Math.min(32767, input[i] * 32768));
      }
      const b64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
      ws.send(JSON.stringify({
        user_audio_chunk: b64
      }));
    };

    btnMic.classList.add('recording');
    setStatus('active', 'LISTENING');
  }

  function stopMic() {
    if (processor) { processor.disconnect(); processor = null; }
    if (audioContext) { audioContext.close(); audioContext = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  }

  async function playAgentAudio(b64) {
    const ctx = new AudioContext();
    const raw = atob(b64);
    const buf = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
    const decoded = await ctx.decodeAudioData(buf.buffer);
    const src = ctx.createBufferSource();
    src.buffer = decoded;
    src.connect(ctx.destination);
    src.start();
  }

  async function triggerLipSync(audioB64) {
    if (isPlayingLipSync) return;
    isPlayingLipSync = true;

    try {
      const res = await fetch('/lipsync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ audio_b64: audioB64 })
      });
      const data = await res.json();

      if (data.video_b64) {
        const blob = new Blob([Uint8Array.from(atob(data.video_b64), c => c.charCodeAt(0))], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        idleVideo.style.display = 'none';
        avatarVideo.style.display = 'block';
        avatarVideo.src = url;
        avatarVideo.play();
        avatarVideo.onended = () => {
          avatarVideo.style.display = 'none';
          idleVideo.style.display = 'block';
          isPlayingLipSync = false;
          URL.revokeObjectURL(url);
        };
      } else {
        isPlayingLipSync = false;
      }
    } catch (e) {
      isPlayingLipSync = false;
    }
  }

  function stopLipSync() {
    avatarVideo.pause();
    avatarVideo.style.display = 'none';
    idleVideo.style.display = 'block';
    isPlayingLipSync = false;
    waveform.classList.remove('active');
  }

  btnMic.addEventListener('click', () => {
    if (!connected) {
      startConversation();
    }
  });

  btnEnd.addEventListener('click', () => {
    if (ws) ws.close();
    stopMic();
    stopLipSync();
    setStatus('', 'ENDED');
  });
</script>
</body>
</html>
