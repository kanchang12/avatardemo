<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Twin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--panel:#0f0f1a;--line:#1e1e2e;--line2:#2e2e4e;--accent:#a78bfa;--accent2:#7c3aed;--green:#4ade80;--red:#f87171;--muted:#8a8aa0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh}

/* gate */
#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;
  background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a0f 70%)}
#gate h1{font-size:2.2rem;letter-spacing:3px;color:var(--accent);margin-bottom:8px;text-align:center}
#gate .sub{color:var(--muted);font-size:.95rem;margin-bottom:34px;text-align:center;max-width:380px;line-height:1.6}
.gatebox{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:28px;width:340px;text-align:center}
.gatebox video{width:170px;height:170px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);display:block;margin:0 auto 18px;background:#1e1e2e}
.field{margin:10px 0;text-align:left}
.field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;background:#15151f;border:1px solid var(--line2);border-radius:10px;color:#fff;font-size:.95rem;outline:none}
.field input:focus{border-color:var(--accent)}
#nameField{display:none}
.gate-hint{font-size:.8rem;color:var(--muted);margin:6px 0 14px;min-height:1.1em;line-height:1.5}
.gate-hint.err{color:var(--red)}
.btn-p{background:var(--accent);color:#fff;border:none;padding:12px 22px;border-radius:10px;cursor:pointer;font-size:.95rem;font-weight:600;width:100%}
.btn-p:hover{background:var(--accent2)}
.btn-p:disabled{background:var(--line2);color:#555;cursor:not-allowed}

/* talk */
#talk{display:none;flex-direction:column;height:100vh}
.nav{display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--line);flex-shrink:0}
.nav h2{color:var(--accent);font-size:1rem;letter-spacing:2px}
.nav .who{margin-left:auto;font-size:.82rem;color:var(--muted)}
.nav button{background:transparent;border:1px solid var(--line2);color:var(--muted);padding:6px 14px;border-radius:16px;cursor:pointer;font-size:.8rem}
.body{display:flex;flex:1;overflow:hidden}

/* stage */
.stage{flex:1;background:#0a0a0f;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#avatarImg{width:100%;height:100%;object-fit:contain;display:block}
#avatarVid{width:100%;height:100%;object-fit:contain;display:none;background:#000}
.stage-name{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:.95rem;color:#cfcfe6;
  letter-spacing:1px;background:rgba(0,0,0,.45);padding:4px 14px;border-radius:20px;pointer-events:none}
.status-badge{position:absolute;top:14px;left:14px;font-size:.75rem;color:var(--green);
  background:rgba(0,0,0,.6);padding:4px 10px;border-radius:20px;display:none}
.status-badge.on{display:block}
.voicewarn{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#2a1010;border:1px solid var(--red);
  color:#fca5a5;font-size:.74rem;padding:6px 12px;border-radius:10px;display:none;max-width:90%;text-align:center;z-index:10}

/* side */
.side{width:380px;border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m .w{font-weight:600;font-size:.74rem;margin-bottom:3px}
.m.user .w{color:var(--accent)}.m.avatar .w{color:var(--green)}
.m .t{font-size:.92rem;line-height:1.6;color:#d4d4e0}
.listenbar{padding:9px 16px;font-size:.8rem;color:var(--green);border-top:1px solid var(--line);display:none;align-items:center;gap:8px}
.listenbar.on{display:flex}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
.composer{padding:13px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.composer input{flex:1;padding:12px 13px;background:#15151f;border:1px solid var(--line2);border-radius:10px;color:#fff;font-size:.92rem;outline:none}
.composer input:focus{border-color:var(--accent)}
.composer button{border:none;color:#fff;width:48px;height:46px;border-radius:10px;cursor:pointer;font-size:1.1rem}
.send{background:var(--accent)}.send:disabled{background:var(--line2);color:#555}
.micbtn{background:#15151f;border:1px solid var(--line2)!important}
.micbtn.rec{background:var(--red)!important;border-color:var(--red)!important}
@media(max-width:760px){.body{flex-direction:column}.side{width:100%;border-left:none;border-top:1px solid var(--line)}.stage{height:50vh}}
</style>
</head>
<body>

<div id="gate">
  <h1>DIGITAL TWIN</h1>
  <p class="sub">Look at the camera and enter your password.</p>
  <div class="gatebox">
    <video id="gateCam" autoplay playsinline muted></video>
    <div id="nameField" class="field"><label>Your name (first visit)</label><input id="nameInp" placeholder="What should the avatar call you?"></div>
    <div class="field"><label>Password</label><input id="pwInp" type="password" placeholder="Your password"></div>
    <p class="gate-hint" id="gateHint"></p>
    <button class="btn-p" id="enterBtn">Look &amp; enter</button>
  </div>
</div>

<div id="talk">
  <div class="nav">
    <h2>DIGITAL TWIN</h2>
    <span class="who" id="whoLabel"></span>
    <button onclick="leaveSession()">Leave</button>
  </div>
  <div class="body">
    <div class="stage">
      <img id="avatarImg" src="/avatar/thumbnail" alt="avatar">
      <video id="avatarVid" autoplay playsinline></video>
      <div class="stage-name" id="stageName"></div>
      <div class="status-badge" id="statusBadge"></div>
      <div class="voicewarn" id="voicewarn"></div>
    </div>
    <div class="side">
      <div class="log" id="log"></div>
      <div class="listenbar" id="listenBar"><span class="dot"></span> Listening…</div>
      <div class="composer">
        <button class="micbtn" id="micBtn">🎙</button>
        <input id="msgInp" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendText()">
        <button class="send" id="sendBtn" onclick="sendText()">↑</button>
      </div>
    </div>
  </div>
</div>

<!-- LiveKit CDN client -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<script>
const img = ()=>document.getElementById('avatarImg');
const vid = ()=>document.getElementById('avatarVid');
const badge = ()=>document.getElementById('statusBadge');

let gateStream=null, livekitRoom=null, sessionId=null, micTrack=null, micActive=false;
let sdSession=null; // DB session data

/* ── gate cam ── */
async function startGateCam(){
  try{
    gateStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    document.getElementById('gateCam').srcObject = gateStream;
  } catch(e){ hint('Camera needed — allow access and reload.',true); }
}
startGateCam();

function hint(t,err){ const h=document.getElementById('gateHint'); h.textContent=t; h.className='gate-hint'+(err?' err':''); }
function snap(){
  const v=document.getElementById('gateCam');
  const c=document.createElement('canvas'); c.width=v.videoWidth||320; c.height=v.videoHeight||240;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85);
}

document.getElementById('enterBtn').onclick = async ()=>{
  const btn=document.getElementById('enterBtn');
  const pw=document.getElementById('pwInp').value.trim();
  const name=document.getElementById('nameInp').value.trim();
  btn.disabled=true; hint('Checking…');
  try{
    const d=await(await fetch('/u/identify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:snap(),password:pw,name})})).json();
    if(d.register){ document.getElementById('nameField').style.display='block';
      hint('New here — enter a name then press again.'); btn.disabled=false; return; }
    if(d.error){ hint(d.error,true); btn.disabled=false; return; }
    enterTalk(d);
  } catch(e){ hint('Error — try again.',true); btn.disabled=false; }
};

/* ── enter talk screen ── */
async function enterTalk(d){
  if(gateStream) gateStream.getTracks().forEach(t=>t.stop());
  document.getElementById('gate').style.display='none';
  document.getElementById('talk').style.display='flex';
  document.getElementById('whoLabel').textContent=(d.returning?'Welcome back, ':'Hello, ')+d.name;
  (d.history||[]).forEach(m=>addMsg(m.speaker==='avatar'?'avatar':'user',m.text));

  // register DB session
  sdSession = await(await fetch('/u/session',{method:'POST'})).json();
  if(sdSession.customer_name) document.getElementById('stageName').textContent=sdSession.customer_name;
  if(sdSession.greeting) addMsg('avatar',sdSession.greeting);

  // start LiveAvatar
  await startLiveAvatar();
}

/* ── LiveAvatar via LiveKit ── */
async function startLiveAvatar(){
  showBadge('Connecting…');
  try{
    const r=await(await fetch('/u/liveavatar_token',{method:'POST'})).json();
    if(r.error){ showWarn(r.error); fallbackAudio(); return; }

    sessionId=r.session_id;
    const LivekitClient = window.LivekitClient;
    livekitRoom = new LivekitClient.Room();

    livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed,(track,pub,participant)=>{
      if(track.kind===LivekitClient.Track.Kind.Video){
        track.attach(vid());
        img().style.display='none';
        vid().style.display='block';
        showBadge('● Speaking');
      }
      if(track.kind===LivekitClient.Track.Kind.Audio){
        track.attach();
      }
    });

    livekitRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed,(track)=>{
      if(track.kind===LivekitClient.Track.Kind.Video){
        vid().style.display='none';
        img().style.display='block';
        badge().className='status-badge';
      }
    });

    livekitRoom.on(LivekitClient.RoomEvent.DataReceived,(data,participant,kind,topic)=>{
      try{
        const msg=JSON.parse(new TextDecoder().decode(data));
        if(msg.event_type==='elevenlabs_agent_event'){
          const et=msg.elevenlabs_event_type, d=msg.data||{};
          if(et==='agent_response' && d.agent_response_event?.agent_response)
            addMsg('avatar',d.agent_response_event.agent_response);
          if(et==='user_transcript' && d.user_transcription_event?.user_transcript)
            addMsg('user',d.user_transcription_event.user_transcript);
        }
        if(msg.event_type==='avatar.speak_started'){ showBadge('● Speaking'); }
        if(msg.event_type==='avatar.speak_ended'){ badge().className='status-badge'; }
        if(msg.event_type==='user.speak_started'){ document.getElementById('listenBar').classList.add('on'); }
        if(msg.event_type==='user.speak_ended'){ document.getElementById('listenBar').classList.remove('on'); }
      } catch(e){}
    });

    livekitRoom.on(LivekitClient.RoomEvent.Disconnected,()=>{
      vid().style.display='none'; img().style.display='block'; badge().className='status-badge';
    });

    await livekitRoom.connect(r.livekit_url, r.livekit_token, {autoSubscribe:true});
    // publish mic
    await livekitRoom.localParticipant.setMicrophoneEnabled(true);
    micActive=true; document.getElementById('micBtn').classList.add('rec');

    showBadge('Connected'); setTimeout(()=>badge().className='status-badge',2000);

    // greet via audio fallback if no video yet
    if(sdSession?.greeting_audio) playAudio(sdSession.greeting_audio, sdSession.greeting);

    wireMicBtn();

  } catch(e){
    showWarn('LiveAvatar: '+e.message);
    fallbackAudio();
  }
}

function wireMicBtn(){
  document.getElementById('micBtn').onclick = async ()=>{
    if(!livekitRoom) return;
    micActive=!micActive;
    await livekitRoom.localParticipant.setMicrophoneEnabled(micActive);
    document.getElementById('micBtn').classList.toggle('rec',micActive);
  };
}

/* ── text send ── */
async function sendText(){
  const inp=document.getElementById('msgInp');
  const txt=inp.value.trim(); if(!txt) return;
  inp.value=''; addMsg('user',txt);
  document.getElementById('sendBtn').disabled=true;

  if(livekitRoom && livekitRoom.state==='connected'){
    // send via LiveKit data channel as elevenlabs_agent_command
    const cmd=JSON.stringify({event_type:'elevenlabs_agent_command',elevenlabs_event_type:'user_message',data:{text:txt}});
    await livekitRoom.localParticipant.publishData(new TextEncoder().encode(cmd),{topic:'agent-control',reliable:true});
  } else {
    // text fallback via Flask
    try{
      const d=await(await fetch('/u/talk',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:txt})})).json();
      if(d.reply){ addMsg('avatar',d.reply); playAudio(d.audio,d.reply); }
    } catch(e){ addMsg('avatar','(error)'); }
  }
  document.getElementById('sendBtn').disabled=false;
}

/* ── leave ── */
async function leaveSession(){
  if(livekitRoom){ try{ await livekitRoom.disconnect(); }catch(e){} livekitRoom=null; }
  location.reload();
}

/* ── fallback audio ── */
function fallbackAudio(){
  if(sdSession?.greeting){ playAudio(sdSession.greeting_audio, sdSession.greeting); }
}
function playAudio(b64,text){
  if(b64){ const a=new Audio('data:audio/mpeg;base64,'+b64); a.play().catch(()=>browserSpeak(text)); }
  else browserSpeak(text);
}
function browserSpeak(text){
  if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(text); window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
}

/* ── helpers ── */
function addMsg(role,text){
  const log=document.getElementById('log');
  const el=document.createElement('div'); el.className='m '+role;
  el.innerHTML='<div class="w">'+(role==='avatar'?'Avatar':'You')+'</div><div class="t"></div>';
  el.querySelector('.t').textContent=text; log.appendChild(el); log.scrollTop=log.scrollHeight;
}
function showBadge(t){ const b=badge(); b.textContent=t; b.className='status-badge on'; }
function showWarn(msg){ const w=document.getElementById('voicewarn'); w.textContent=msg; w.style.display='block'; setTimeout(()=>w.style.display='none',6000); }
</script>
</body>
</html>
