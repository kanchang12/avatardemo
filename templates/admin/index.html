<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Digital Twin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--panel:#0f0f1a;--line:#1e1e2e;--line2:#2e2e4e;--accent:#a78bfa;--accent2:#7c3aed;--green:#4ade80;--red:#ef4444;--muted:#8a8aa0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
.nav{display:flex;align-items:center;gap:12px;padding:13px 24px;border-bottom:1px solid var(--line)}
.nav h2{color:var(--accent);font-size:1rem;letter-spacing:2px}
.nav a{margin-left:auto;color:var(--muted);font-size:.8rem;text-decoration:none;border:1px solid var(--line2);padding:6px 14px;border-radius:16px}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat .n{font-size:1.7rem;color:var(--accent);font-weight:700}
.stat .l{font-size:.74rem;color:var(--muted);margin-top:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.panel h3{font-size:1rem;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:4px}
.fld input{width:100%;padding:10px 12px;background:#15151f;border:1px solid var(--line2);border-radius:9px;color:#fff;outline:none;font-size:.9rem}
.fld input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;padding:11px 20px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--accent2)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.76rem}
.tag{font-size:.72rem;padding:3px 9px;border-radius:10px}
.tag.on{background:rgba(74,222,128,.15);color:var(--green)}
.tag.off{background:rgba(239,68,68,.15);color:var(--red)}
.mini{background:transparent;border:1px solid var(--line2);color:#ccc;padding:5px 11px;border-radius:8px;cursor:pointer;font-size:.78rem;margin-right:5px}
.mini:hover{border-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15151f;border:1px solid var(--green);color:#fff;padding:11px 18px;border-radius:10px;font-size:.85rem;display:none}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="nav"><h2>ADMIN · DIGITAL TWIN</h2><a href="/admin/logout">Log out</a></div>
<div class="wrap">
  <div class="statgrid" id="stats"></div>

  <div class="panel">
    <h3>Add an avatar (customer)</h3>
    <div class="grid2">
      <div class="fld"><label>Name</label><input id="cName" placeholder="Petar"></div>
      <div class="fld"><label>Email (login)</label><input id="cEmail" placeholder="petar@example.com"></div>
      <div class="fld"><label>Password</label><input id="cPw" type="password" placeholder="set a password"></div>
      <div class="fld"><label>ElevenLabs voice ID (voice clone)</label><input id="cVoice" placeholder="voice_id"></div>
    </div>
    <button class="btn" onclick="addCustomer()">Create avatar</button>
  </div>

  <div class="panel">
    <h3>Avatars</h3>
    <table><thead><tr><th>Name</th><th>Email</th><th>Voice ID</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="custBody"></tbody></table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
async function loadStats(){
  const s=await (await fetch('/admin/stats')).json();
  const labels={total_customers:'Avatars',total_users:'Users',total_sessions:'Sessions',total_messages:'Messages',total_knowledge_chunks:'Memories',total_recordings:'Recordings',total_ego_revisions:'EGO revisions'};
  document.getElementById('stats').innerHTML=Object.entries(labels).map(([k,l])=>'<div class="stat"><div class="n">'+(s[k]||0)+'</div><div class="l">'+l+'</div></div>').join('');
}
async function loadCustomers(){
  const c=await (await fetch('/admin/customers')).json();
  document.getElementById('custBody').innerHTML=c.map(x=>
    '<tr><td>'+x.name+'</td><td>'+x.email+'</td>'+
    '<td><input style="width:140px;padding:5px;background:#15151f;border:1px solid var(--line2);border-radius:7px;color:#fff;font-size:.78rem" value="'+(x.voice_id||'')+'" id="v_'+x.id+'"></td>'+
    '<td><span class="tag '+(x.active?'on':'off')+'">'+(x.active?'active':'off')+'</span></td>'+
    '<td><button class="mini" onclick="saveVoice(\''+x.id+'\')">Save voice</button>'+
    '<button class="mini" onclick="toggle(\''+x.id+'\')">Toggle</button></td></tr>').join('');
}
async function addCustomer(){
  const body={name:document.getElementById('cName').value.trim(),email:document.getElementById('cEmail').value.trim(),
    password:document.getElementById('cPw').value,voice_id:document.getElementById('cVoice').value.trim()};
  if(!body.name||!body.email||!body.password){ toast('Name, email and password required.'); return; }
  const r=await fetch('/admin/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(); if(d.ok){ toast('Avatar created.'); ['cName','cEmail','cPw','cVoice'].forEach(i=>document.getElementById(i).value=''); loadCustomers(); loadStats(); }
  else toast(d.error||'Failed.');
}
async function saveVoice(id){
  const v=document.getElementById('v_'+id).value.trim();
  await fetch('/admin/customer/'+id+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:v})});
  toast('Voice ID saved.');
}
async function toggle(id){ await fetch('/admin/toggle_customer/'+id,{method:'POST'}); loadCustomers(); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none',2400); }
loadStats(); loadCustomers();
</script>
</body>
</html>
