<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — TRIONE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:360px;background:#0f0f1a;border:1px solid #1e1e2e;border-radius:16px;padding:36px 32px}
.logo{color:#a78bfa;font-size:1.1rem;letter-spacing:3px;text-align:center;margin-bottom:8px}
.sub{color:#555;font-size:0.78rem;text-align:center;margin-bottom:28px}
label{display:block;font-size:0.75rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
input{width:100%;background:#0a0a0f;border:1px solid #2e2e4e;border-radius:9px;color:#fff;padding:11px 14px;font-size:0.88rem;outline:none;margin-bottom:18px;font-family:inherit}
input:focus{border-color:#a78bfa}
button{width:100%;background:#a78bfa;color:#fff;border:none;border-radius:9px;padding:12px;font-size:0.9rem;cursor:pointer;font-weight:600;letter-spacing:0.5px}
button:hover{background:#9061f9}
.err{color:#ef4444;font-size:0.8rem;text-align:center;margin-top:14px;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">TRIONE</div>
  <div class="sub">Digital Twin Platform</div>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Sign In</button>
  <div class="err" id="err"></div>
</div>
<script>
async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('err');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; return; }
  try {
    const r = await fetch('/customer/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const d = await r.json();
    if (d.ok) {
      window.location.href = '/customer/';
    } else {
      errEl.textContent = d.error || 'Login failed.';
    }
  } catch (e) {
    errEl.textContent = 'Network error. Please try again.';
  }
}
</script>
</body>
</html>
